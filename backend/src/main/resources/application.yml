spring:
  application:
    name: devtype-backend

  # ── PostgreSQL (Neon) ─────────────────────────────────────────────────────
  # Set these environment variables before running the backend:
  #   DATABASE_URL  →  jdbc:postgresql://<host>/<db>?sslmode=require
  #   DB_USER       →  your Neon project username
  #   DB_PASSWORD   →  your Neon project password
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5        # Keep low for Neon free tier connection limit
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none                # Flyway manages all DB migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── JWT ───────────────────────────────────────────────────────────────────
# Set these environment variables:
#   JWT_SECRET    →  a Base64-encoded 256-bit secret (min 32 chars)
#                    generate with: openssl rand -base64 32
#   JWT_EXPIRY_MS →  (deprecated) kept for backward compat; use below instead
jwt:
  secret: ${JWT_SECRET}
  # Access token: 15 minutes (900 000 ms)
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  # Refresh token: 7 days (604 800 000 ms)
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

# ── CORS ──────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Socket.IO ─────────────────────────────────────────────────────────────
socketio:
  host: ${SOCKETIO_HOST:0.0.0.0}
  port: ${SOCKETIO_PORT:9092}

# ── External AI (Fireworks AI - DeepSeek-V4-Pro-0813) ──────────────────────
# Set FIREWORKS_API_KEY env var with your Fireworks API key
fireworks:
  api-key: ${FIREWORKS_API_KEY:}
  base-url: ${FIREWORKS_BASE_URL:https://api.fireworks.ai/inference/v1}
  model: ${FIREWORKS_MODEL:accounts/fireworks/models/deepseek-v4-pro-0813}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── App-level flags ───────────────────────────────────────────────────────────
app:
  # Expose a raw devResetToken in the forgot-password response for local dev
  # convenience (no real email provider needed).
  # MUST remain false in any non-local deployment.
  # Override to true only in your local .env: EXPOSE_DEV_RESET_TOKEN=true
  expose-dev-reset-token: ${EXPOSE_DEV_RESET_TOKEN:false}

# ── Logging ───────────────────────────────────────────────────────────────
logging:
  level:
    com.devtype.backend: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
